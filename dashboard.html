<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Train a Tetris AI with a genetic algorithm, CMA-ES, NEAT or reinforcement learning. Run several training workers in parallel, compare algorithms on live charts, and replay the best agent found so far."
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Press+Start+2P"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="tetris.css" />
    <link rel="stylesheet" href="dashboard.css" />
    <link rel="stylesheet" href="site-nav.css" />
    <title>Tetris AI Training</title>
    <link rel="icon" href="assets/images/favgif.gif" type="image/gif" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <script src="scripts/dashboard.js" type="module"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.min.js" defer></script>
  </head>
  <body id="dashboard-body">
    <nav class="navbar navbar-expand-md navbar-dark site-nav">
      <div class="container-fluid">
        <a class="navbar-brand" href="index.html">Tetris</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#siteNavLinks"
          aria-controls="siteNavLinks"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="siteNavLinks">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Play</a></li>
            <li class="nav-item"><a class="nav-link active" href="dashboard.html">Train AI</a></li>
            <li class="nav-item"><a class="nav-link" href="contest.html">My AIs &amp; Contests</a></li>
            <li class="nav-item"><a class="nav-link" href="algorithms.html">How it works</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container-fluid dashboard-container">
      <h1 class="page-title">Tetris AI Training</h1>
      <div class="row g-3">
        <div class="col-12 col-lg-4">
          <div class="dashboard-card">
            <h3>Controls</h3>
            <div class="mb-2" id="algorithm-select-row">
              <label for="algorithm-select" class="form-label">Algorithm</label>
              <select id="algorithm-select" class="form-select form-select-sm">
                <option value="genetic-algorithm">Genetic Algorithm</option>
                <option value="cma-es">CMA-ES</option>
                <option value="neat">NEAT</option>
                <option value="rl">Reinforcement Learning</option>
              </select>
            </div>
            <div class="mb-2">
              <label class="form-label">Or compare several side-by-side</label>
              <div id="algorithm-picker" class="d-flex flex-wrap gap-2">
                <button type="button" class="btn btn-outline-warning btn-sm algo-chip" data-algorithm="genetic-algorithm" aria-pressed="false">Genetic Algorithm</button>
                <button type="button" class="btn btn-outline-warning btn-sm algo-chip" data-algorithm="cma-es" aria-pressed="false">CMA-ES</button>
                <button type="button" class="btn btn-outline-warning btn-sm algo-chip" data-algorithm="neat" aria-pressed="false">NEAT</button>
                <button type="button" class="btn btn-outline-warning btn-sm algo-chip" data-algorithm="rl" aria-pressed="false">Reinforcement Learning</button>
              </div>
              <button type="button" id="clear-compare-selection" class="btn btn-link btn-sm p-0 mt-1" style="display: none;">Clear selection</button>
            </div>
            <div class="mb-2">
              <label for="population-size" class="form-label">Population size</label>
              <input
                id="population-size"
                type="number"
                class="form-control form-control-sm"
                min="4"
                max="200"
                value="50"
              />
            </div>
            <div class="mb-2">
              <label for="worker-count" class="form-label">Worker count</label>
              <input
                id="worker-count"
                type="number"
                class="form-control form-control-sm"
                min="1"
                max="8"
                value="4"
              />
            </div>
            <div class="mb-3">
              <label for="max-moves" class="form-label">Max moves per game</label>
              <input
                id="max-moves"
                type="number"
                class="form-control form-control-sm"
                min="50"
                max="50000"
                step="50"
                value="5000"
              />
            </div>
            <div class="d-flex flex-wrap gap-2">
              <button id="start-training" type="button" class="btn btn-primary btn-sm">Start</button>
              <button id="pause-training" type="button" class="btn btn-secondary btn-sm">Pause</button>
              <button id="reset-training" type="button" class="btn btn-danger btn-sm">Reset</button>
            </div>
          </div>

          <div class="dashboard-card" id="best-genome-card" style="display: none;">
            <h3>Best genome</h3>
            <div class="mb-2" id="genome-source-row" style="display: none;">
              <label for="genome-source" class="form-label">Genome source</label>
              <select id="genome-source" class="form-select form-select-sm">
                <option value="genetic-algorithm">Genetic Algorithm</option>
                <option value="cma-es">CMA-ES</option>
                <option value="neat">NEAT</option>
                <option value="rl">Reinforcement Learning</option>
              </select>
            </div>
            <div class="d-flex flex-wrap gap-2">
              <button id="save-best-genome" type="button" class="btn btn-outline-light btn-sm">Save</button>
              <button id="download-best-genome" type="button" class="btn btn-outline-light btn-sm">Download JSON</button>
              <label for="load-genome-file" class="btn btn-outline-light btn-sm mb-0">
                Load JSON
                <input id="load-genome-file" type="file" accept="application/json" class="file-input-hidden" />
              </label>
              <button id="watch-best-agent" type="button" class="btn btn-outline-light btn-sm">Watch it play</button>
            </div>
            <div class="mt-3 d-flex flex-wrap gap-2 align-items-center">
              <input
                id="roster-name-input"
                type="text"
                class="form-control form-control-sm"
                style="max-width: 200px;"
                placeholder="Name this AI"
                maxlength="40"
              />
              <button id="add-to-roster" type="button" class="btn btn-outline-warning btn-sm">Add to my AIs</button>
            </div>
            <p id="persistence-status" class="dashboard-status mt-2" role="status" aria-live="polite"></p>
          </div>
        </div>

        <div class="col-12 col-lg-4">
          <div class="dashboard-card">
            <h3>Stats</h3>
            <div id="stats-panels"></div>
            <h3 class="mt-3">Best genes</h3>
            <div id="best-genes-panels"></div>
          </div>
        </div>

        <div class="col-12 col-lg-4">
          <div class="dashboard-card">
            <h3>Watch best agent</h3>
            <canvas id="replay-board" class="game-board replay-board" role="img"
              aria-label="Live replay of the best trained AI playing Tetris"></canvas>
            <p id="replay-status" class="dashboard-status mt-2" role="status" aria-live="polite"></p>
          </div>
        </div>

        <div class="col-12 col-lg-6">
          <div class="dashboard-card">
            <h3>Score per generation</h3>
            <canvas id="score-chart" role="img"
              aria-label="Line chart: best and average score for each generation"></canvas>
          </div>
        </div>

        <div class="col-12 col-lg-6">
          <div class="dashboard-card">
            <h3>Average moves per generation</h3>
            <canvas id="moves-chart" role="img"
              aria-label="Line chart: average moves survived per generation"></canvas>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
